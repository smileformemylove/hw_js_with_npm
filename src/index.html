<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>

<div class="weather-container">
    <h1>Weather in <span id="city-name">Loading...</span></h1>
    <img id="weather-icon" class="weather-icon" src="" alt="Weather icon">
    <div class="weather-info">
        <p> Temperature: <span id="temperature"></span>°C</p>
        <p> Pressure: <span id="pressure"></span> hPa</p>
        <p> Description: <span id="description"></span></p>
        <p> Humidity: <span id="humidity"></span>%</p>
        <p> Wind Speed: <span id="wind-speed"></span> m/s</p>
        <p> Wind Direction: <span id="wind-direction"></span>°</p>
    </div>
</div>

<script src="./js/script.js" type="module"></script>
</body>
</html>
